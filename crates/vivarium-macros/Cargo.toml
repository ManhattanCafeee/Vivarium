[package]
name = "vivarium-macros"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
description = "Proc-macros for vivarium: derive(Entity)."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "2"

[dev-dependencies]
chrono = "0.4.45"
serde_json = "1.0.151"
trybuild = "1.0.119"
uuid = "1.26.0"
vivarium-core = { version = "0.3.1", path = "../vivarium-core", features = ["chrono", "uuid"] }
