[package]
name = "vivarium-core"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
description = "Core types for vivarium: Page, Pagination, Order, Column, Sorter."

[features]
default = []
# `chrono` values in [`Value`] (`DateTime<Utc>`, `NaiveDate`).
chrono = ["dep:chrono"]
# `uuid::Uuid` values in [`Value`].
uuid = ["dep:uuid"]
# Derives `ToSchema` for `Page`/`Pagination` and implements utoipa's
# `IntoParams` for `Pagination`. Must live here: the impls and the types have
# to share a crate.
utoipa = ["dep:utoipa"]

[dependencies]
# `utoipa`'s derive comes from its default `macros` feature, so this cannot be
# `default-features = false`.
utoipa = { version = "5.5", optional = true }
chrono = { version = "0.4.45", optional = true, default-features = false, features = ["std", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", optional = true }

[package.metadata.docs.rs]
# Build the docs with every optional feature enabled, so feature-gated items
# (drivers, extractors, utoipa, telemetry) are documented rather than missing.
all-features = true
