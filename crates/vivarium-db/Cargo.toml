[package]
name = "vivarium-db"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
description = "sqlx ergonomics for vivarium: typed CRUD, chainable queries, pagination."

[features]
default = []
# SQLite driver (sqlx/sqlite).
sqlite = ["sqlx/sqlite"]
# PostgreSQL driver (sqlx/postgres).
postgres = ["sqlx/postgres"]
# MySQL driver (sqlx/mysql); `mysql-rsa` enables RSA key exchange for
# non-TLS connections (required by a default local MySQL 8 server).
mysql = ["sqlx/mysql", "sqlx/mysql-rsa"]

[dependencies]
chrono = "0.4.45"
log = "0.4.34"
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "json", "chrono", "uuid", "runtime-tokio"] }
uuid = "1.26.0"
vivarium-core = { version = "0.3.2", path = "../vivarium-core", features = ["chrono", "uuid"] }
vivarium-macros = { version = "0.3.2", path = "../vivarium-macros" }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }

[package.metadata.docs.rs]
# Build the docs with every optional feature enabled, so feature-gated items
# (drivers, extractors, utoipa, telemetry) are documented rather than missing.
all-features = true
