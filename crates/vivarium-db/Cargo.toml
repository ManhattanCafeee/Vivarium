[package]
name = "vivarium-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "sqlx ergonomics for vivarium: typed CRUD, chainable queries, pagination."

[features]
default = []
# SQLite driver (sqlx/sqlite).
sqlite = ["sqlx/sqlite"]
# PostgreSQL driver (sqlx/postgres).
postgres = ["sqlx/postgres"]
# MySQL driver (sqlx/mysql).
mysql = ["sqlx/mysql"]

[dependencies]
log = "0.4.34"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "json", "runtime-tokio"] }
tracing = "0.1.44"
vivarium-core = { version = "0.1.0", path = "../vivarium-core" }
vivarium-macros = { version = "0.1.0", path = "../vivarium-macros" }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
