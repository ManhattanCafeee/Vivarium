[package]
name = "vivarium-config"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
description = "Hot-reloadable typed config for vivarium: figment + notify + ArcSwap."

[dependencies]
arc-swap = "1"
figment = { version = "0.10", features = ["toml", "yaml", "json", "env"] }
notify = "8"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
