[package]
name = "vivarium-web"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
description = "axum ergonomics for vivarium: ApiError, validated extractors, JWT auth, cache layer."

[dependencies]
axum = { version = "0.8.9", features = ["json", "form", "query", "tokio"] }
garde = { version = "0.22.1", features = ["derive", "email"] }
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net"] }
tower = "0.5.3"

[dev-dependencies]
base64 = "0.23.1"
http-body-util = "0.1.5"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
