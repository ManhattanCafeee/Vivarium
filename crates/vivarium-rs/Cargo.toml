[package]
name = "vivarium-rs"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
authors.workspace = true
description = "vivarium-rs facade: feature-gated re-exports of the vivarium family."

[features]
default = ["web", "config", "db", "db-sqlite", "db-postgres"]
# The core database layer (no driver). With `web` enabled this also turns on
# `vivarium-web/sqlx`, so `ApiError::conflict_from_db` is available.
db = ["dep:vivarium-db", "vivarium-web?/sqlx"]
# SQLite driver.
db-sqlite = ["db", "vivarium-db/sqlite"]
# PostgreSQL driver.
db-postgres = ["db", "vivarium-db/postgres"]
# MySQL driver.
db-mysql = ["db", "vivarium-db/mysql"]
# axum web layer.
web = ["dep:vivarium-web"]
# Hot-reloadable config.
config = ["dep:vivarium-config"]
# The `Garde*` extractors of `vivarium-web` (bound to `garde::Validate`).
validation-garde = ["vivarium-web?/validation-garde"]
# `ToSchema` derives for the shared types plus the `vivarium_web::openapi`
# helpers (spec metadata and security schemes).
utoipa = ["vivarium-core/utoipa", "vivarium-web?/utoipa"]
# `openapi::mount`: serves the spec plus Scalar and Swagger UI.
utoipa-ui = ["utoipa", "vivarium-web?/utoipa-ui"]
# `vivarium_web::serve::telemetry::init`: stdout plus optional JSON log files.
# Like the other `vivarium-web` features this is inert without `web`.
telemetry = ["vivarium-web?/telemetry"]

[dependencies]
vivarium-core = { version = "0.3.1", path = "../vivarium-core" }
vivarium-db = { version = "0.3.1", path = "../vivarium-db", optional = true, default-features = false }
vivarium-web = { version = "0.3.1", path = "../vivarium-web", optional = true }
vivarium-config = { version = "0.3.1", path = "../vivarium-config", optional = true }
vivarium-macros = { version = "0.3.1", path = "../vivarium-macros" }

[dev-dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
chrono = "0.4"
http-body-util = "0.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros", "migrate", "json", "chrono"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
validator = { version = "0.20", features = ["derive"] }

[package.metadata.docs.rs]
# Build the docs with every optional feature enabled, so feature-gated items
# (drivers, extractors, utoipa, telemetry) are documented rather than missing.
all-features = true
