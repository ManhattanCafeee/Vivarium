[workspace]
members = [
    "crates/vivarium-core",
    "crates/vivarium-macros",
    "crates/vivarium-db",
    "crates/vivarium-web",
    "crates/vivarium-config",
    "crates/vivarium-rs",
]
resolver = "3"

[workspace.package]
# Versions are maintained in each crate's own manifest (`[workspace.package]`
# intentionally provides no `version`).
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/ManhattanCafeee/Vivarium"
authors = ["Vivarium contributors"]
description = "Type-safe ergonomics on top of sqlx and axum: pagination, sorting whitelists, unified errors, validation extractors, and hot-reloadable config."

[profile.release]
lto = "thin"
