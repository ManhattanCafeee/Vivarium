name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # PostgreSQL integration tests read DATABASE_URL; MySQL tests read
  # MYSQL_DATABASE_URL so the two can run in the same job.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/vivarium
  MYSQL_DATABASE_URL: mysql://root:root@127.0.0.1:3306/vivarium
  # The driver tests self-skip when their URL is unset. In CI that would turn a
  # missing or misconfigured service into a green job with zero coverage, so
  # these flags make the tests panic instead of returning early.
  VIVARIUM_REQUIRE_POSTGRES: "1"
  VIVARIUM_REQUIRE_MYSQL: "1"

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, 1.94.0]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vivarium
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vivarium
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Test (PostgreSQL + MySQL integration)
        run: cargo test --workspace --all-features
      - name: README doctests really ran
        # The root README is compiled as doctests by `vivarium-rs` only under
        # `doctest` plus the `web`, `config` and `db-sqlite` features; without
        # them the run silently skips those tests and still exits 0. `--all-features`
        # must therefore produce `ReadmeDoctests` entries in the output, and at
        # least the five the README's snippets yield today: turning one into
        # `rust,ignore` would otherwise drop it from the suite unnoticed. The log
        # file keeps `grep -q` from closing the pipe early (which would send
        # SIGPIPE into the test harness); `pipefail` keeps cargo's exit code
        # authoritative — the greps are only the "did it really run" probes.
        run: |
          set -eo pipefail
          cargo test --doc -p vivarium-rs --all-features 2>&1 | tee /tmp/readme-doctests.log
          grep -q ReadmeDoctests /tmp/readme-doctests.log
          test "$(grep -c ReadmeDoctests /tmp/readme-doctests.log)" -ge 5
      - name: Feature combinations
        # `--all-features` cannot prove that a single feature compiles on its
        # own, so the optional features are checked individually.
        run: |
          cargo check -p vivarium-core
          cargo check -p vivarium-core --no-default-features --features utoipa
          cargo check -p vivarium-core --no-default-features --features chrono
          cargo check -p vivarium-core --no-default-features --features uuid
          cargo check -p vivarium-config
          cargo check -p vivarium-db
          cargo check -p vivarium-db --no-default-features --features sqlite
          cargo check -p vivarium-db --no-default-features --features postgres
          cargo check -p vivarium-db --no-default-features --features mysql
          cargo check -p vivarium-web
          cargo check -p vivarium-web --no-default-features
          cargo check -p vivarium-web --no-default-features --features validation-validator
          cargo check -p vivarium-web --no-default-features --features validation-garde
          cargo check -p vivarium-web --no-default-features --features sqlx
          cargo check -p vivarium-web --no-default-features --features utoipa
          cargo check -p vivarium-web --no-default-features --features utoipa-ui
          cargo check -p vivarium-web --no-default-features --features telemetry
          cargo check -p vivarium-rs --no-default-features
          cargo check -p vivarium-rs --no-default-features --features db-mysql
          cargo check -p vivarium-rs --no-default-features --features web,telemetry
      - name: Path dependency versions match the workspace
        # `cargo publish` refuses a path dependency whose version requirement
        # does not resolve to the same crate, and that only surfaces at release
        # time — so the requirements are checked here instead. `pipefail` matters:
        # without it a failing `jq` would be masked by `tee`, and the step would
        # pass while checking nothing.
        run: |
          set -o pipefail
          cargo metadata --format-version 1 --no-deps > /tmp/metadata.json
          jq -r '
            .packages as $members
            | ($members | map({ key: .name, value: .version }) | from_entries) as $versions
            | $members[]
            | . as $package
            | $package.dependencies[]
            | select(.path != null)
            | . as $dependency
            | ($versions[$dependency.name]) as $workspace
            | if $workspace == null
              then "\($package.name): path dependency \($dependency.name) is not a workspace member"
              elif ($dependency.req | ltrimstr("^")) != $workspace
              then "\($package.name) requires \($dependency.name) \($dependency.req), but the workspace crate is \($workspace)"
              else empty
              end
          ' /tmp/metadata.json | tee /tmp/mismatch.txt
          test ! -s /tmp/mismatch.txt
      - name: Doc
        run: cargo doc --no-deps --all-features
      - name: Offline query check
        run: SQLX_OFFLINE=true cargo check --workspace --all-features
